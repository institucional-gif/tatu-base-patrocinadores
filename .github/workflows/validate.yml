name: Validar base
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Checagem de integridade (totais e reconciliacao r2 x r3)
        run: python schema/validate.py
# Roda em TODO PR para main (e no push em main), para que o status check "validar"
# sempre reporte. Um check exigido que nunca roda deixa o PR travado em "Expected".
# A branch main exige este check verde via ruleset (Settings > Rules).
