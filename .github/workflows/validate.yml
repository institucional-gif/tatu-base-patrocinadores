name: Validar base
on:
  pull_request:
    paths: ["data/**", "schema/validate.py"]
  push:
    branches: [main]
    paths: ["data/**"]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Checagem de integridade (totais e reconciliacao r2 x r3)
        run: python schema/validate.py
# Regra: nenhum PR que altere data/ entra sem este check verde.
# Proteja a branch main exigindo este status check (Settings > Branches > Branch protection).
